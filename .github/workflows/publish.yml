# Builds the English site (root) and the French site (/fr/) with Quarto,
# then publishes everything to GitHub Pages. Runs on every push to main.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render English site
        run: quarto render en

      - name: Render French site
        run: quarto render fr

      - name: Assemble public folder
        run: |
          mkdir -p public
          cp -r en/_site/. public/
          mkdir -p public/fr
          cp -r fr/_site/. public/fr/
          cp -r assets public/assets
          cp -r assets public/fr/assets
          touch public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
